<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rock Paper Scissors Game - Play against the computer">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main heading -->
    <h1>Rock Paper Scissors</h1>
    
    <!-- Game choices container -->
    <div class="choices">
        <!-- Rock choice button -->
        <div class="choice" id="rock" title="Click to play Rock">
            <img src="./images/rock.png" alt="Rock">
        </div>
        <!-- Paper choice button -->
        <div class="choice" id="paper" title="Click to play Paper">
            <img src="./images/paper.png" alt="Paper">
        </div>
        <!-- Scissors choice button -->
        <div class="choice" id="scissors" title="Click to play Scissors">
            <img src="./images/scissors.png" alt="Scissors">
        </div>
    </div>

    <!-- Score board -->
    <div class="score-board">
        <!-- User score -->
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <!-- Computer score -->
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>

    <!-- Game message display -->
    <div class="msg-cont">
        <p id="msg">Play Your Move</p>
    </div>

    <!-- Controls: Reset button -->
    <div class="controls">
        <button id="reset-btn" title="Reset game">Reset</button>
    </div>

    <!-- Load game script -->
    <script src="scripts.js"></script>
</body>
</html>
